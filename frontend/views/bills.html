<div id="bills-main">
    <div class="bills-form">
        <h2>Add a Bill</h2>
        <form id="billForm">
            <label for="billName">Bill Name</label>
            <input type="text" id="billName" name="billName" required>

            <label for="billCtg">Choose category</label>
            <select name="billCtg" id="ctg">
                <option value="housing">Housing</option>
                <option value="transportation">Transportation</option>
                <option value="food">Food</option>
                <option value="utilities">Utilities</option>
                <option value="clothing">Clothing</option>
                <option value="medicalhealthcare">Medical/Healthcare</option>
            </select>

            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>

            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" name="dueDate" required>

            <button type="submit">Add Bill</button>
        </form>

        <h2>Bill History</h2>
        <table id="billsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Due Date</th>
                </tr>
            </thead>
            <tbody id="billsBody">
                <tr class="no-bills"><td colspan="4">No bills added yet.</td></tr>
            </tbody>
        </table>
    </div>
</div>
